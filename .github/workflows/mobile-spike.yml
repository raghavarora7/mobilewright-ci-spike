name: mobile-spike

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MOBILEWRIGHT_DISABLE_TELEMETRY: '1'

jobs:
  ios:
    # A repo variable swaps this for a self-hosted label later, e.g. [self-hosted, macOS, ARM64].
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install mobilewright
        run: npm install --no-audit --no-fund
      - name: Boot iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          UDID=$(node scripts/pick-sim.mjs)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Doctor
        run: npx mobilewright doctor --category ios || true
      - name: Install the on-device agent
        run: npx mobilewright install -d "${{ steps.sim.outputs.udid }}"
      - name: Run tests
        env:
          MW_PLATFORM: ios
          MW_DEVICE_ID: ${{ steps.sim.outputs.udid }}
        run: npx mobilewright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: |
            results/
            test-results/
            mobilewright-report/

  android:
    runs-on: ${{ vars.ANDROID_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install mobilewright
        run: npm install --no-audit --no-fund
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MW_PLATFORM: android
          MW_DEVICE_ID: emulator-5554
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            npx mobilewright doctor --category android || true
            npx mobilewright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            results/
            test-results/
            mobilewright-report/
